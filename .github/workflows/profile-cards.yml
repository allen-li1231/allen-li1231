name: Generate profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B6E69&color_dots=#ebedf0,#c6e4df,#7fc2b8,#2e9c90,#0B6E69
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4EC1B5&color_dots=#161b22,#173b3a,#1f6a64,#2e9c90,#4EC1B5

      - name: Generate stats, languages and contribution cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses a personal access token if you add one as the SUMMARY_GITHUB_TOKEN secret;
          # otherwise falls back to the repository's built-in token.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: America/New_York
          EXCLUDE_REPOS: vscode,hue,shadowsocks-android,fastText,bert4keras,machinelearning,Recipes
          AUTO_PUSH: false

      - name: Collect the light and dark cards
        run: |
          # The snake step runs in Docker and leaves dist/ owned by root
          sudo chown -R "$(id -u):$(id -g)" dist
          mkdir -p dist/cards/light dist/cards/dark
          cp profile-summary-card-output/github/*.svg dist/cards/light/
          cp profile-summary-card-output/github_dark/*.svg dist/cards/dark/
          ls -R dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
